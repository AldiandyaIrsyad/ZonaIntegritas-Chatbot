services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_backend
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-provisioner:
    image: alpine:latest
    container_name: ollama_provisioner
    profiles: ["provisioner"]
    depends_on:
      - ollama
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "apk add --no-cache curl &&
      echo 'Waiting for Ollama to start...' &&
      until curl -s http://ollama:11434/api/tags > /dev/null; do sleep 2; done &&
      echo 'Pulling lightweight model...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:0.5b\"}' &&
      echo 'Model ready.'"

  # --- RAG Infrastructure ---

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles: ["ingestion", "chat"]

  infinity:
    image: michaelf34/infinity:latest
    container_name: infinity_embeddings
    restart: unless-stopped
    ports:
      - "7997:7997"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      INFINITY_BATCH_SIZE: "2"
      INFINITY_MODEL_WARMUP: "true;true;true;false"
      HF_TOKEN: ${INFINITY_HF_API_KEY}
    # Add models/prompt_guard/config.json to the third model, Because it's wrongly interpreted

    command: >
      v2
      --model-id ${INFINITY_EMBEDDING_MODEL}
      --model-id ${INFINITY_RERANKER_MODEL}
      --model-id ${INFINITY_PROMPT_GUARD_MODEL}
      --model-id ${INFINITY_NLI_MODEL}
      --device cuda
      --dtype float16
      
    
    profiles: ["ingestion", "chat"]
    volumes:
      - infinity_cache:/app/.cache
      - ./models/prompt_guard/config.json:/app/.cache/huggingface/hub/models--meta-llama--Llama-Prompt-Guard-2-86M/snapshots/a8ded8e697ce7c355e395a0df51f94adb4a2fd27/config.json:ro

  unstructured-api:
    image: quay.io/unstructured-io/unstructured-api:latest
    container_name: unstructured_parser
    restart: unless-stopped
    ports:
      - "8001:8000"

  # --- Observability Stack ---
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    profiles: ["monitoring"]

  vector:
    image: timberio/vector:0.47.0-alpine
    container_name: vector
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./observability/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: --config /etc/vector/vector.yaml
    depends_on:
      - loki
    profiles: ["monitoring"]

  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - loki
    profiles: ["monitoring"]

volumes:
  postgres_data:
  ollama_data:
  qdrant_data:
  loki_data:
  grafana_data:
  infinity_cache: