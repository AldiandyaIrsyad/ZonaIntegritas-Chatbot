<!-- Input Area -->
<div class="w-full pt-4 pb-6 px-4 md:px-8 bg-white dark:bg-darkbg shrink-0">
  <div class="max-w-3xl mx-auto relative">
    <form @submit.prevent="submitMessage" class="relative flex items-end shadow-md rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-darkborder overflow-hidden focus-within:ring-1 focus-within:ring-slate-300 dark:focus-within:ring-[#444] transition-all">
      <textarea 
        id="message-input" 
        x-model="input"
        @input="autoResize"
        @keydown.enter.prevent="if(!$event.shiftKey) submitMessage()"
        :disabled="isSubmitting"
        class="flex-1 max-h-[200px] min-h-[56px] w-full resize-none bg-transparent px-4 py-4 focus:outline-none dark:text-gray-100 placeholder-slate-400 dark:placeholder-gray-400" 
        placeholder="Message Mock LLM..." 
        rows="1"
        required
      ></textarea>
      <div class="p-2">
        <button type="submit" :disabled="isSubmitting || input.trim() === ''" class="p-2 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-black hover:opacity-80 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed transition-opacity flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </form>
    <div class="text-center mt-3 text-xs text-slate-500 dark:text-gray-400">
      Mock LLM may generate inaccurate info.
    </div>
  </div>
</div>
