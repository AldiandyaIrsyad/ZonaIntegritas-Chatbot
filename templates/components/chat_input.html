<!-- Input Area -->
<div class="w-full pt-4 pb-6 px-4 md:px-8 bg-white dark:bg-darkbg shrink-0">
  <div class="max-w-3xl mx-auto relative">
    
    <!-- Uploaded Documents Preview & Upload Spinner -->
    <div x-show="pendingDocument || isUploading" class="flex flex-wrap gap-2 mb-2" style="display: none;">
      <template x-if="pendingDocument">
        <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 rounded-lg px-3 py-1 text-sm text-slate-700 dark:text-gray-300 shadow-sm border border-slate-200 dark:border-slate-700">
          <template x-if="pendingDocument.thumbnail">
            <img :src="pendingDocument.thumbnail" class="h-6 w-6 object-cover rounded">
          </template>
          <template x-if="!pendingDocument.thumbnail">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
          </template>
          <span class="truncate max-w-[150px]" x-text="pendingDocument.filename"></span>
        </div>
      </template>
      <!-- Spinner is shown independently of the doc list -->
      <div x-show="isUploading" class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 rounded-lg px-3 py-1 text-sm text-slate-500">
         <span class="w-4 h-4 rounded-full border-2 border-t-transparent border-slate-400 animate-spin"></span> Uploading...
      </div>
    </div>

    <form @submit.prevent="submitMessage" class="relative flex items-end shadow-md rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-darkborder overflow-hidden focus-within:ring-1 focus-within:ring-slate-300 dark:focus-within:ring-[#444] transition-all">
      <div class="p-2 flex items-center justify-center">
        <label x-show="!pendingDocument && documents.length === 0" for="file-upload" class="cursor-pointer p-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-gray-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" :class="{'opacity-50 pointer-events-none': isUploading}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
          <input id="file-upload" type="file" accept="application/pdf,image/jpeg,image/png" class="hidden" @change="uploadFile" :disabled="isUploading">
        </label>
      </div>
      <textarea 
        id="message-input" 
        x-model="input"
        @input="autoResize"
        @keydown.enter="if(!$event.shiftKey) { $event.preventDefault(); submitMessage(); }"
        :disabled="isSubmitting"
        class="flex-1 max-h-[200px] min-h-[56px] w-full resize-none bg-transparent px-4 py-4 focus:outline-none dark:text-gray-100 placeholder-slate-400 dark:placeholder-gray-400" 
        placeholder="Message Mock LLM..." 
        rows="1"
        required
      ></textarea>
      <div class="p-2">
        <button type="submit" :disabled="isSubmitting || input.trim() === ''" class="p-2 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-black hover:opacity-80 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed transition-opacity flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </form>
    <div class="text-center mt-3 text-xs text-slate-500 dark:text-gray-400">
      Mock LLM may generate inaccurate info.
    </div>
  </div>
</div>
