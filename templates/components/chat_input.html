<!-- Input Area -->
<div
  class="w-full flex-none border-t border-slate-200 dark:border-darkborder bg-white dark:bg-darkbg px-4 md:px-8 py-4"
>
  <div class="max-w-3xl mx-auto relative">
    <!-- File Preview Area -->
    <template x-if="files.length > 0">
      <div class="flex flex-wrap gap-2 mb-2 p-2 bg-slate-50 dark:bg-darkinput rounded-xl border border-slate-200 dark:border-darkborder shadow-sm">
        <template x-for="(f, index) in files" :key="index">
          <div class="flex items-center gap-2 bg-slate-200 dark:bg-[#333] px-3 py-1.5 rounded-lg text-sm text-slate-700 dark:text-gray-200">
            <!-- Document/Image Icon -->
            <svg x-show="f.file.type.includes('image')" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-500" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" />
            </svg>
            <svg x-show="f.file.type.includes('pdf')" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-red-500" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd" />
            </svg>
            <span class="truncate max-w-[150px] font-medium" x-text="f.file.name"></span>
            <button @click.prevent="removeFile(index)" class="text-slate-400 hover:text-red-500 transition-colors ml-1 focus:outline-none">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        </template>
      </div>
    </template>

    <form
      @submit.prevent="submitMessage"
      class="relative flex items-end shadow-md rounded-2xl bg-white dark:bg-darkinput border border-slate-200 dark:border-darkborder overflow-hidden focus-within:ring-1 focus-within:ring-slate-300 dark:focus-within:ring-[#444] transition-all"
    >
      <div class="p-2 flex items-center justify-center">
        <label class="p-2 cursor-pointer rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-[#333] dark:text-gray-400 dark:hover:text-gray-200 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
          <input type="file" class="hidden" multiple accept="image/*,application/pdf" @change="handleFileSelect">
        </label>
      </div>
      <textarea
        id="message-input"
        x-model="input"
        @input="autoResize"
        @keydown.enter.prevent="if(!$event.shiftKey) submitMessage()"
        :disabled="isSubmitting"
        class="flex-1 max-h-[200px] min-h-[56px] w-full resize-none bg-transparent px-4 py-4 focus:outline-none dark:text-gray-100 placeholder-slate-400 dark:placeholder-gray-400"
        placeholder="Message Mock LLM..."
        rows="1"
        required
      ></textarea>
      <div class="p-2">
        <button
          type="submit"
          :disabled="isSubmitting || (input.trim() === '' && files.length === 0)"
          class="p-2 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-black hover:opacity-80 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed transition-opacity flex items-center justify-center"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </form>
    <div class="text-center mt-3 text-xs text-slate-500 dark:text-gray-400">
      Mock LLM may generate inaccurate info.
    </div>
  </div>
</div>
