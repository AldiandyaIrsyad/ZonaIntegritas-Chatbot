<!-- Sidebar -->
<aside class="w-[260px] bg-slate-100 dark:bg-darksidebar flex flex-col transition-all duration-300 h-full shrink-0">
  <div class="p-3 space-y-2 border-b border-slate-200 dark:border-darkborder">
    <a href="/admin/" class="w-full flex items-center justify-start gap-3 rounded-lg hover:bg-slate-200 dark:hover:bg-[#202020] px-3 py-3 text-sm font-medium transition-colors text-slate-700 dark:text-gray-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
      </svg>
      Admin Dashboard
    </a>
    <button id="new-chat-btn" class="w-full flex items-center justify-start gap-3 rounded-lg hover:bg-slate-200 dark:hover:bg-[#202020] px-3 py-3 text-sm font-medium transition-colors text-slate-900 dark:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
      </svg>
      New chat
    </button>
  </div>
  <div class="flex-1 overflow-y-auto px-3 space-y-1 mt-2" id="session-list">
    <!-- Sessions loaded here -->
  </div>
</aside>

<script>
  (function() {
    const sessionList = document.getElementById('session-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    
    async function fetchAndRenderSessions() {
      try {
        const res = await fetch('/api/sessions');
        const sessions = await res.json();
        
        if (sessionList) sessionList.innerHTML = '';
        sessions.reverse().forEach(session => {
          const container = document.createElement('div');
          container.className = 'group relative flex items-center w-full mb-1';

          const btn = document.createElement('button');
          const isActive = window.currentSessionId === session.id;
          btn.className = `flex-1 text-left px-3 py-2.5 rounded-lg text-sm truncate transition-colors flex items-center gap-2 ${
            isActive 
              ? 'bg-slate-200 dark:bg-[#202020] text-slate-900 dark:text-white font-medium' 
              : 'text-slate-600 dark:text-gray-400 hover:bg-slate-200/50 dark:hover:bg-[#202020] hover:text-slate-900 dark:hover:text-gray-200'
          }`;
          btn.innerHTML = `<span class="truncate">${session.title}</span>`;
          btn.onclick = () => {
            if (window.location.pathname === '/') {
              if (window.loadSession) window.loadSession(session.id);
            } else {
              window.location.href = '/?session_id=' + session.id;
            }
          };

          const menuBtn = document.createElement('button');
          menuBtn.className = 'absolute right-2 p-1.5 rounded hover:bg-slate-300 dark:hover:bg-gray-600 text-slate-500 dark:text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity';
          menuBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>';
          menuBtn.onclick = (e) => {
            e.stopPropagation();
            const menu = document.getElementById(`menu-${session.id}`);
            const isHidden = menu.classList.contains('hidden');
            document.querySelectorAll('.session-menu').forEach(m => m.classList.add('hidden'));
            if (isHidden) menu.classList.remove('hidden');
          };

          const menuDropdown = document.createElement('div');
          menuDropdown.id = `menu-${session.id}`;
          menuDropdown.className = 'session-menu hidden absolute right-0 top-8 w-32 bg-white dark:bg-darkinput shadow-lg rounded-md border border-slate-200 dark:border-darkborder z-50';
          
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-slate-100 dark:hover:bg-gray-700 rounded-md transition-colors flex items-center gap-2';
          deleteBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> Delete';
          deleteBtn.onclick = async (e) => {
            e.stopPropagation();
            if (!confirm('Are you sure you want to delete this chat?')) return;
            try {
              const res = await fetch(`/api/sessions/${session.id}`, { method: 'DELETE' });
              if (res.ok) {
                if (window.currentSessionId === session.id) {
                  if (window.location.pathname === '/' && window.createNewSession) {
                    window.createNewSession();
                  } else {
                    window.location.href = '/';
                  }
                } else {
                  fetchAndRenderSessions();
                }
              }
            } catch (err) {
              console.error(err);
            }
          };
          
          menuDropdown.appendChild(deleteBtn);

          container.appendChild(btn);
          container.appendChild(menuBtn);
          container.appendChild(menuDropdown);

          if (sessionList) sessionList.appendChild(container);
        });
      } catch (e) {
        console.error("Failed to load sessions", e);
      }
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.session-menu').forEach(m => m.classList.add('hidden'));
    });

    if (newChatBtn) {
      newChatBtn.addEventListener('click', () => {
        if (window.location.pathname === '/') {
          if (window.createNewSession) window.createNewSession();
        } else {
          window.location.href = '/';
        }
      });
    }

    window.loadSessions = fetchAndRenderSessions;
    
    // Auto load sessions if not on root (where it handles its own load logic)
    if (window.location.pathname !== '/') {
      fetchAndRenderSessions();
    }
  })();
</script>
