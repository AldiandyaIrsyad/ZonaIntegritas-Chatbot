{% extends "base.html" %}

{% block title %}Admin Dashboard - {{ super() }}{% endblock %}

{% block layout %}
{% include "components/sidebar.html" %}

<!-- Main Admin Area -->
<main 
  x-data="adminDashboard()" 
  x-init="init()"
  class="flex-1 flex flex-col h-full bg-white dark:bg-darkbg relative min-w-0 overflow-y-auto"
>
  <!-- Header -->
  <header class="h-14 flex items-center px-6 sticky top-0 z-10 text-lg font-medium border-b border-slate-200 dark:border-darkborder bg-white/80 dark:bg-darkbg/80 backdrop-blur">
    <div class="text-slate-900 dark:text-gray-100">Admin Dashboard</div>
  </header>

  <div class="p-6 max-w-4xl mx-auto w-full space-y-8">
    <!-- Upload Section -->
    <section class="bg-slate-50 dark:bg-darksidebar p-6 rounded-xl border border-slate-200 dark:border-darkborder">
      <h2 class="text-xl font-semibold mb-4 text-slate-900 dark:text-white">Upload New PDF</h2>
      <form @submit.prevent="uploadDocument" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-1">Title</label>
          <input type="text" x-model="title" required class="w-full bg-white dark:bg-darkinput border border-slate-300 dark:border-darkborder rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand dark:text-white" placeholder="Document Title">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-1">Description</label>
          <textarea x-model="desc" class="w-full bg-white dark:bg-darkinput border border-slate-300 dark:border-darkborder rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand dark:text-white" rows="3" placeholder="Brief description"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-1">PDF File</label>
          <input type="file" @change="file = $event.target.files[0]" accept="application/pdf" required class="w-full text-sm text-slate-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand file:text-white hover:file:bg-blue-700 cursor-pointer">
        </div>
        <button type="submit" :disabled="uploading" class="bg-brand text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors w-full sm:w-auto disabled:opacity-50">
          <span x-text="uploading ? 'Uploading...' : 'Upload Document'"></span>
        </button>
        <div x-show="uploadStatus.show" x-text="uploadStatus.message" :class="uploadStatus.isError ? 'text-red-600 dark:text-red-400' : 'text-green-600 dark:text-green-400'" class="text-sm mt-2 block" style="display: none;"></div>
      </form>
    </section>

    <!-- PDF List Section -->
    <section>
      <h2 class="text-xl font-semibold mb-4 text-slate-900 dark:text-white">Uploaded Documents</h2>
      <div class="space-y-3">
        
        <!-- Currently disabled because it will push layout around. -->
        <!-- <template x-if="loading">
          <div class="text-slate-500 dark:text-gray-400 text-sm italic">Loading documents...</div>
        </template> -->
        
        <template x-if="!loading && pdfs.length === 0">
          <div class="text-slate-500 dark:text-gray-400 text-sm italic">No documents uploaded yet.</div>
        </template>
        
        <template x-for="pdf in pdfs" :key="pdf.id">
          <div class="bg-white dark:bg-darksidebar p-4 rounded-xl border border-slate-200 dark:border-darkborder flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
            <div class="flex-1">
              <h3 class="font-medium text-slate-900 dark:text-white" x-text="pdf.title"></h3>
              <div class="flex items-center gap-2 mt-1">
                <p class="text-sm text-slate-500 dark:text-gray-400" x-text="pdf.description || 'No description provided.'"></p>
                <span 
                  class="text-xs px-2 py-0.5 rounded-full font-medium capitalize"
                  :class="{
                    'bg-yellow-100 text-yellow-800 dark:bg-yellow-900/30 dark:text-yellow-400': pdf.ingestion_status === 'pending' || pdf.ingestion_status === 'processing',
                    'bg-green-100 text-green-800 dark:bg-green-900/30 dark:text-green-400': pdf.ingestion_status === 'completed',
                    'bg-red-100 text-red-800 dark:bg-red-900/30 dark:text-red-400': pdf.ingestion_status === 'failed'
                  }"
                  x-text="pdf.ingestion_status"
                ></span>
              </div>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto mt-3 sm:mt-0">
              <!-- Toggle Switch -->
              <label class="flex items-center cursor-pointer gap-2 text-sm text-slate-700 dark:text-gray-300">
                <span>Active</span>
                <div class="relative">
                  <input type="checkbox" class="sr-only" :checked="pdf.active" @change="toggleStatus(pdf.id, $event.target.checked)">
                  <div class="block w-10 h-6 rounded-full transition-colors" :class="pdf.active ? 'bg-brand' : 'bg-slate-200 dark:bg-gray-700'"></div>
                  <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform" :class="pdf.active ? 'transform translate-x-4' : ''"></div>
                </div>
              </label>
              
              <!-- Delete button -->
              <button @click="deletePDF(pdf.id)" class="text-red-500 hover:text-red-700 text-sm font-medium px-3 py-1.5 rounded bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 transition-colors">
                Delete
              </button>
            </div>
          </div>
        </template>
        
      </div>
    </section>
  </div>
</main>

<script>
  function adminDashboard() {
    return {
      pdfs: [],
      loading: true,
      title: '',
      desc: '',
      file: null,
      uploading: false,
      uploadStatus: { show: false, message: '', isError: false },
      pollInterval: null,
      
      async init() {
        await this.loadPDFs();
        this.startPolling();
      },
      
      startPolling() {
        if (this.pollInterval) clearInterval(this.pollInterval);
        this.pollInterval = setInterval(() => {
          if (this.pdfs.some(p => p.ingestion_status === 'pending' || p.ingestion_status === 'processing')) {
            this.pollStatus();
          }
        }, 3000);
      },
      
      async pollStatus() {
        try {
          const res = await fetch('/api/admin/pdfs');
          if (res.ok) {
            const data = await res.json();
            data.forEach(newPdf => {
              const existing = this.pdfs.find(p => p.id === newPdf.id);
              if (existing) {
                existing.ingestion_status = newPdf.ingestion_status;
                existing.active = newPdf.active;
              } else {
                this.pdfs.push(newPdf);
              }
            });
          }
        } catch (e) {
          console.error("Failed to poll status", e);
        }
      },
      
      async loadPDFs() {
        this.loading = true;
        try {
          const res = await fetch('/api/admin/pdfs');
          if (res.ok) {
            this.pdfs = await res.json();
          } else {
            console.error("Failed to load PDFs", await res.text());
          }
        } catch (e) {
          console.error("Failed to load PDFs", e);
        } finally {
          this.loading = false;
        }
      },
      
      async toggleStatus(id, active) {
        try {
          const res = await fetch(`/api/admin/pdfs/${id}/status`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active })
          });
          if (!res.ok) {
            alert('Failed to update status');
          }
          await this.loadPDFs();
        } catch (e) {
          console.error(e);
          await this.loadPDFs();
        }
      },
      
      async deletePDF(id) {
        if (!confirm('Are you sure you want to delete this document?')) return;
        try {
          const res = await fetch(`/api/admin/pdfs/${id}`, { method: 'DELETE' });
          if (res.ok) {
            await this.loadPDFs();
          } else {
            alert('Failed to delete document');
          }
        } catch (e) {
          console.error(e);
        }
      },
      
      async uploadDocument() {
        if (!this.file) return;
        
        this.uploading = true;
        this.uploadStatus = { show: false, message: '', isError: false };
        
        const formData = new FormData();
        formData.append('title', this.title);
        formData.append('description', this.desc);
        formData.append('file', this.file);
        
        try {
          const res = await fetch('/api/admin/pdfs', {
            method: 'POST',
            body: formData
          });
          
          if (res.ok) {
            this.uploadStatus = { show: true, message: 'Upload successful!', isError: false };
            this.title = '';
            this.desc = '';
            this.file = null;
            document.querySelector('input[type="file"]').value = '';
            await this.loadPDFs();
          } else {
            const err = await res.json();
            this.uploadStatus = { show: true, message: err.error || 'Upload failed.', isError: true };
          }
        } catch (err) {
          console.error(err);
          this.uploadStatus = { show: true, message: 'An error occurred during upload.', isError: true };
        } finally {
          this.uploading = false;
          setTimeout(() => {
            this.uploadStatus.show = false;
          }, 3000);
        }
      }
    }
  }
</script>
{% endblock %}
