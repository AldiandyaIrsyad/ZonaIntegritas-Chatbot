{% extends "base.html" %}

{% block title %}Admin Dashboard - {{ super() }}{% endblock %}

{% block layout %}
{% include "components/sidebar.html" %}

<!-- Main Admin Area -->
<main class="flex-1 flex flex-col h-full bg-white dark:bg-darkbg relative min-w-0 overflow-y-auto">
  <!-- Header -->
  <header class="h-14 flex items-center px-6 sticky top-0 z-10 text-lg font-medium border-b border-slate-200 dark:border-darkborder bg-white/80 dark:bg-darkbg/80 backdrop-blur">
    <div class="text-slate-900 dark:text-gray-100">Admin Dashboard</div>
  </header>

  <div class="p-6 max-w-4xl mx-auto w-full space-y-8">
    <!-- Upload Section -->
    <section class="bg-slate-50 dark:bg-darksidebar p-6 rounded-xl border border-slate-200 dark:border-darkborder">
      <h2 class="text-xl font-semibold mb-4 text-slate-900 dark:text-white">Upload New PDF</h2>
      <form id="upload-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-1">Title</label>
          <input type="text" id="pdf-title" required class="w-full bg-white dark:bg-darkinput border border-slate-300 dark:border-darkborder rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand dark:text-white" placeholder="Document Title">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-1">Description</label>
          <textarea id="pdf-desc" class="w-full bg-white dark:bg-darkinput border border-slate-300 dark:border-darkborder rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand dark:text-white" rows="3" placeholder="Brief description"></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-gray-300 mb-1">PDF File</label>
          <input type="file" id="pdf-file" accept="application/pdf" required class="w-full text-sm text-slate-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-brand file:text-white hover:file:bg-blue-700 cursor-pointer">
        </div>
        <button type="submit" id="upload-btn" class="bg-brand text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors w-full sm:w-auto">
          Upload Document
        </button>
        <div id="upload-status" class="text-sm mt-2 hidden"></div>
      </form>
    </section>

    <!-- PDF List Section -->
    <section>
      <h2 class="text-xl font-semibold mb-4 text-slate-900 dark:text-white">Uploaded Documents</h2>
      <div id="pdf-list" class="space-y-3">
        <!-- PDFs will be populated here -->
        <div class="text-slate-500 dark:text-gray-400 text-sm italic">Loading documents...</div>
      </div>
    </section>
  </div>
</main>

<script>
  const uploadForm = document.getElementById('upload-form');
  const uploadBtn = document.getElementById('upload-btn');
  const uploadStatus = document.getElementById('upload-status');
  const pdfList = document.getElementById('pdf-list');

  async function loadPDFs() {
    try {
      const res = await fetch('/api/admin/pdfs');
      const pdfs = await res.json();
      
      pdfList.innerHTML = '';
      
      if (pdfs.length === 0) {
        pdfList.innerHTML = '<div class="text-slate-500 dark:text-gray-400 text-sm italic">No documents uploaded yet.</div>';
        return;
      }
      
      pdfs.forEach(pdf => {
        const item = document.createElement('div');
        item.className = 'bg-white dark:bg-darksidebar p-4 rounded-xl border border-slate-200 dark:border-darkborder flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between';
        
        const info = document.createElement('div');
        info.className = 'flex-1';
        info.innerHTML = `
          <h3 class="font-medium text-slate-900 dark:text-white">${pdf.title}</h3>
          <p class="text-sm text-slate-500 dark:text-gray-400 mt-1">${pdf.description || 'No description provided.'}</p>
        `;
        
        const actions = document.createElement('div');
        actions.className = 'flex items-center gap-3 w-full sm:w-auto mt-3 sm:mt-0';
        
        // Toggle Switch
        const toggleLabel = document.createElement('label');
        toggleLabel.className = 'flex items-center cursor-pointer gap-2 text-sm text-slate-700 dark:text-gray-300';
        const isChecked = pdf.active ? 'checked' : '';
        toggleLabel.innerHTML = `
          <span>Active</span>
          <div class="relative">
            <input type="checkbox" class="sr-only" ${isChecked} onchange="toggleStatus('${pdf.id}', this.checked)">
            <div class="block w-10 h-6 rounded-full transition-colors ${pdf.active ? 'bg-brand' : 'bg-slate-200 dark:bg-gray-700'}"></div>
            <div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${pdf.active ? 'transform translate-x-4' : ''}"></div>
          </div>
        `;
        
        // Delete button
        const delBtn = document.createElement('button');
        delBtn.className = 'text-red-500 hover:text-red-700 text-sm font-medium px-3 py-1.5 rounded bg-red-50 dark:bg-red-900/20 hover:bg-red-100 dark:hover:bg-red-900/40 transition-colors';
        delBtn.textContent = 'Delete';
        delBtn.onclick = () => deletePDF(pdf.id);
        
        actions.appendChild(toggleLabel);
        actions.appendChild(delBtn);
        
        item.appendChild(info);
        item.appendChild(actions);
        pdfList.appendChild(item);
      });
    } catch (e) {
      console.error("Failed to load PDFs", e);
      pdfList.innerHTML = '<div class="text-red-500 text-sm">Failed to load documents.</div>';
    }
  }
  
  window.toggleStatus = async function(id, active) {
    try {
      const res = await fetch(`/api/admin/pdfs/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ active })
      });
      if (res.ok) {
        loadPDFs();
      } else {
        alert('Failed to update status');
        loadPDFs(); // Revert UI
      }
    } catch (e) {
      console.error(e);
      loadPDFs();
    }
  }
  
  window.deletePDF = async function(id) {
    if (!confirm('Are you sure you want to delete this document?')) return;
    try {
      const res = await fetch(`/api/admin/pdfs/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadPDFs();
      } else {
        alert('Failed to delete document');
      }
    } catch (e) {
      console.error(e);
    }
  }

  uploadForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('pdf-title').value;
    const desc = document.getElementById('pdf-desc').value;
    const fileInput = document.getElementById('pdf-file');
    
    if (fileInput.files.length === 0) return;
    
    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading...';
    uploadStatus.className = 'text-sm mt-2 hidden';
    
    const formData = new FormData();
    formData.append('title', title);
    formData.append('description', desc);
    formData.append('file', fileInput.files[0]);
    
    try {
      const res = await fetch('/api/admin/pdfs', {
        method: 'POST',
        body: formData
      });
      
      if (res.ok) {
        uploadStatus.textContent = 'Upload successful!';
        uploadStatus.className = 'text-sm mt-2 text-green-600 dark:text-green-400 block';
        uploadForm.reset();
        loadPDFs();
      } else {
        const err = await res.json();
        uploadStatus.textContent = err.error || 'Upload failed.';
        uploadStatus.className = 'text-sm mt-2 text-red-600 dark:text-red-400 block';
      }
    } catch (err) {
      console.error(err);
      uploadStatus.textContent = 'An error occurred during upload.';
      uploadStatus.className = 'text-sm mt-2 text-red-600 dark:text-red-400 block';
    } finally {
      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Upload Document';
      
      setTimeout(() => {
        uploadStatus.className = 'text-sm mt-2 hidden';
      }, 3000);
    }
  });

  // Init
  loadPDFs();
</script>
{% endblock %}
