{% extends "base.html" %} {% block title %}Chat - {{ super() }}{% endblock %} {%
block layout %} {% include "components/sidebar.html" %}

<!-- Main Chat Area -->
<main
  x-data="chatInterface()"
  class="flex-1 flex flex-col h-full bg-white dark:bg-darkbg relative min-w-0"
>
  <!-- Header -->
  <header
    class="h-14 flex items-center justify-between px-4 sticky top-0 z-10 text-sm font-medium"
  >
    <div class="truncate text-slate-500 dark:text-gray-400" x-text="title">
      Mock LLM
    </div>
  </header>

  <!-- Messages -->
  <div
    id="chat-messages"
    class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 scroll-smooth"
  >
    <template x-if="messages.length === 0 && documents.length === 0 && !pendingDocument">
      {% include "components/empty_state.html" %}
    </template>

    <!-- Uploaded Documents in Chat Flow -->
    <template x-if="documents.length > 0">
      <div class="flex gap-4 max-w-3xl mx-auto w-full flex-row-reverse">
        <!-- Avatar -->
        <div class="w-8 h-8 rounded-full flex items-center justify-center shrink-0 mt-1 bg-slate-200 dark:bg-[#2f2f2f] text-slate-600 dark:text-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
          </svg>
        </div>
        <!-- Content Bubble -->
        <div class="max-w-[calc(100%-3rem)] flex-1 flex flex-col items-end">
          <div class="flex flex-col gap-2">
            <template x-for="(doc, index) in documents" :key="index">
              <div class="flex items-center gap-3 bg-white dark:bg-[#2f2f2f] border border-slate-200 dark:border-slate-700 rounded-xl p-3 shadow-sm text-sm text-slate-800 dark:text-gray-200">
                <template x-if="doc.thumbnail">
                  <img :src="doc.thumbnail" class="h-10 w-10 object-cover rounded shadow-sm border border-slate-100 dark:border-slate-600">
                </template>
                <template x-if="!doc.thumbnail">
                  <div class="h-10 w-10 bg-slate-100 dark:bg-slate-800 rounded flex items-center justify-center text-brand">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                  </div>
                </template>
                <div class="flex flex-col">
                  <span class="truncate max-w-[200px] font-medium" x-text="doc.filename"></span>
                  <span class="text-xs text-slate-500 dark:text-slate-400">PDF Document</span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <template x-for="(msg, index) in messages" :key="index">
      <div
        :class="['flex gap-4 max-w-3xl mx-auto w-full', msg.role === 'user' ? 'flex-row-reverse' : '']"
      >
        <!-- Avatar -->
        <div
          :class="['w-8 h-8 rounded-full flex items-center justify-center shrink-0 mt-1', msg.role === 'user' ? 'bg-slate-200 dark:bg-[#2f2f2f] text-slate-600 dark:text-gray-300' : 'bg-brand text-white']"
        >
          <template x-if="msg.role === 'user'">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                clip-rule="evenodd"
              />
            </svg>
          </template>
          <template x-if="msg.role === 'assistant'">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"
              />
            </svg>
          </template>
        </div>

        <!-- Content Bubble -->
        <div
          :class="['max-w-[calc(100%-3rem)] flex-1', msg.role === 'user' ? 'flex flex-col items-end' : '']"
        >
          <!-- User Message -->
          <template x-if="msg.role === 'user'">
            <div
              class="whitespace-pre-wrap break-words leading-relaxed bg-slate-200 dark:bg-[#2f2f2f] text-slate-900 dark:text-gray-100 px-4 py-2.5 rounded-2xl rounded-tr-md"
              x-text="msg.content"
            ></div>
          </template>

          <!-- LLM Message (Markdown) -->
          <template x-if="msg.role === 'assistant'">
            <div
              class="prose prose-slate dark:prose-invert prose-p:leading-relaxed prose-pre:bg-slate-800 dark:prose-pre:bg-slate-900 max-w-none text-slate-900 dark:text-gray-200 py-1.5 marker:text-slate-400"
              x-html="renderMessage(msg.content)"
            ></div>
          </template>
        </div>
      </div>
    </template>
  </div>

  {% include "components/chat_input.html" %}
</main>

<script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("chatInterface", () => ({
      messages: [],
      documents: [],
      pendingDocument: null,
      currentSessionId:
        new URLSearchParams(window.location.search).get("session_id") || null,
      title: "New Chat",
      input: "",
      isSubmitting: false,
      isUploading: false,

      init() {
        if (this.currentSessionId) {
          this.loadSession(this.currentSessionId);
        }

        window.addEventListener("load-session", (e) => {
          this.currentSessionId = e.detail.id;
          this.loadSession(this.currentSessionId);
        });

        window.addEventListener("new-session", () => {
          this.currentSessionId = null;
          this.title = "New Chat";
          this.messages = [];
          this.documents = [];
          this.pendingDocument = null;
        });
      },

      renderMessage(content) {
        if (!content) return "";
        
        // Transform citations BEFORE DOMPurify and BEFORE marked.parse 
        // (to prevent marked from turning *...* into <em>...</em>)
        let markdown = content.replace(/\s*\*\((Supported|Contradiction|Neutral):\s*([0-9.]+)(?:;\s*(.+?)(?:;\s*Page\s*(\d+))?)?\)\*/g, (match, status, score, source, page) => {
          let bgColor = 'bg-gray-500';
          if (status === 'Supported') bgColor = 'bg-green-500';
          else if (status === 'Contradiction') bgColor = 'bg-orange-500';

          let tooltip = `<strong>${status}</strong>: ${score}`;
          if (source) tooltip += `<br><span class="text-slate-300">Source:</span> ${source}`;
          if (page) tooltip += `<br><span class="text-slate-300">Page:</span> ${page}`;

          return `<span class="group relative inline-block ml-1 cursor-pointer align-text-bottom" data-citation="true"><span class="inline-flex items-center justify-center w-[16px] h-[16px] rounded-full text-[10px] font-bold text-white shadow-sm ${bgColor} hover:ring-2 hover:ring-offset-1 hover:ring-slate-400 transition-all dark:hover:ring-offset-[#2f2f2f]">i</span><span class="absolute bottom-full left-1/2 mb-2 hidden w-max -translate-x-1/2 rounded-lg bg-slate-800 dark:bg-black px-3 py-2 text-xs text-white opacity-0 transition-opacity group-hover:block group-hover:opacity-100 z-50 shadow-xl border border-slate-700/50 leading-relaxed font-sans font-normal text-left">${tooltip}</span></span>`;
        });
        
        let html = marked.parse(markdown, { breaks: true });
        return DOMPurify.sanitize(html, { ADD_ATTR: ['data-citation', 'target'] });
      },

      async loadSession(id) {
        try {
          const res = await fetch(`/api/sessions/${id}`);
          const data = await res.json();
          if (data.error) return;
          this.title = data.title;
          this.messages = data.messages;
          this.documents = data.documents || [];
          this.pendingDocument = null;
          this.scrollToBottom();
        } catch (e) {
          console.error(e);
        }
      },

      scrollToBottom() {
        this.$nextTick(() => {
          const el = document.getElementById("chat-messages");
          if (el) el.scrollTop = el.scrollHeight;
        });
      },

      autoResize(e) {
        e.target.style.height = "auto";
        e.target.style.height = e.target.scrollHeight + "px";
      },

      async uploadFile(e) {
        const file = e.target.files[0];
        if (!file) return;

        // Ensure a session exists before uploading (the backend requires it).
        if (!this.currentSessionId) {
          try {
            const res = await fetch("/api/sessions", { method: "POST" });
            if (!res.ok) throw new Error("Failed to create session");
            const data = await res.json();
            this.currentSessionId = data.id;
            window.dispatchEvent(
              new CustomEvent("session-created", { detail: { id: data.id } }),
            );
          } catch (err) {
            console.error("Could not create session before upload:", err);
            return;
          }
        }

        this.isUploading = true;
        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch(`/api/sessions/${this.currentSessionId}/upload`, {
            method: "POST",
            body: formData,
          });
          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.detail || "Upload failed");
          }
          const data = await res.json();
          this.pendingDocument = data;
        } catch (err) {
          console.error("Upload failed", err);
          alert(`Failed to upload file: ${err.message}`);
        } finally {
          this.isUploading = false;
          e.target.value = null; // reset so same file can be re-selected
        }
      },

      async submitMessage() {
        const msg = this.input.trim();
        if (!msg || this.isSubmitting) return;

        if (!this.currentSessionId) {
          try {
            const res = await fetch("/api/sessions", { method: "POST" });
            const data = await res.json();
            this.currentSessionId = data.id;
            window.dispatchEvent(
              new CustomEvent("session-created", { detail: { id: data.id } }),
            );
          } catch (e) {
            console.error(e);
            return;
          }
        }

        this.input = "";
        const textarea = document.getElementById("message-input");
        if (textarea) textarea.style.height = "auto";
        this.isSubmitting = true;

        if (this.pendingDocument) {
          this.documents.push(this.pendingDocument);
          this.pendingDocument = null;
        }

        this.messages.push({ role: "user", content: msg });
        const llmIndex =
          this.messages.push({ role: "assistant", content: "" }) - 1;
        this.scrollToBottom();

        try {
          const response = await fetch(
            `/api/sessions/${this.currentSessionId}/stream`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: msg }),
            },
          );

          if (!response.ok) throw new Error("Network error");

          const reader = response.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value, { stream: true });
            this.messages[llmIndex].content += chunk;
            this.scrollToBottom();
          }

          window.dispatchEvent(new Event("session-updated"));
        } catch (e) {
          console.error(e);
          this.messages[llmIndex].content = "Error: Failed to fetch response.";
        } finally {
          this.isSubmitting = false;
          this.$nextTick(() => {
            if (textarea) textarea.focus();
          });
        }
      },
    }));
  });
</script>
{% endblock %}
