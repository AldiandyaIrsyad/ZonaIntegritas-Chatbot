<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ title | default('Skripsi App') }}{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#2563eb',
              darkbg: '#212121',
              darksidebar: '#171717',
              darkborder: '#2f2f2f',
              darkinput: '#2f2f2f',
            },
          },
        },
      };
    </script>
    <style>
      /* Custom scrollbar for dark mode */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-darkbg dark:text-gray-100 flex overflow-hidden h-screen text-[15px]">
    {% block layout %}{% endblock %}
  </body>
</html>
