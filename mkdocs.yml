site_name: Chat Application with PDF Knowledge Base
site_description: Intelligent chat system leveraging LLMs and PDF document management
site_author: Development Team
site_url: https://example.com/docs

# Repository configuration
repo_url: https://github.com/example/repo
repo_name: skripsi_app
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/favicon.ico
  icon:
    logo: material/chat

# Navigation structure
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Documentation:
      - Overview: api/overview.md
      - Chat Endpoints: api/chat.md
      - PDF Management: api/pdf.md
      - Models & Schemas: api/schemas.md
  - Architecture:
      - System Overview: architecture/overview.md
      - Data Flow: architecture/data-flow.md
      - Components: architecture/components.md
  - Development:
      - Setup: development/setup.md
      - Running Tests: development/testing.md
      - Contributing: development/contributing.md

# Markdown extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

# Plugins
plugins:
  - search:
      lang: en
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_object_full_path: true
            members_order: source
            parameter_headings: true

# Extra CSS/JS
extra_css:
  - assets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Copyright info
copyright: Copyright &copy; 2026 Development Team. All rights reserved.

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com
    - icon: fontawesome/brands/twitter
      link: https://twitter.com
  version:
    provider: mike
    default: latest
