sources:
  docker_logs:
    type: docker_logs
    # Automatically discovers and reads logs from all running Docker containers.
    # Vector reads via the Docker daemon socket mounted at /var/run/docker.sock.
  app_tcp:
    type: socket
    address: "0.0.0.0:9000"
    mode: tcp

transforms:
  parse_json:
    type: remap
    inputs:
      - docker_logs
      - app_tcp
    source: |
      # Attempt to parse the log message as JSON.
      # If parsing fails (e.g. non-JSON logs from other containers),
      # keep the raw message and set defaults.
      parsed, err = parse_json(string!(.message))
      if err == null && is_object(parsed) {
        . = merge!(., parsed)
      }

      # Extract key fields as top-level for Loki label mapping.
      # The string() function makes field access fallible if the field doesn't exist,
      # which allows us to use the error coalescing operator (??).
      .app_name = string(.label."com.docker.compose.service") ?? "skripsi_app"
      .log_level = string(.level) ?? string(.levelname) ?? "INFO"
      .event_type = string(.event) ?? ""
      .logger_name = string(.name) ?? ""

sinks:
  loki:
    type: loki
    inputs:
      - parse_json
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      app_name: "{{ app_name }}"
      level: "{{ log_level }}"
      event: "{{ event_type }}"
      source: "{{ logger_name }}"
    # Remove internal Docker metadata fields from the stored log body
    # to reduce storage. The important data is in the JSON message itself.
    remove_label_fields: true
